<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Project Infinity data thinking map</title>
  <desc id="desc">A visual flow from reality through data, database, SQL, insight, decision, and business impact.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="220" rx="8" fill="url(#panel)"/>
  <path d="M78 110 C136 28 225 30 284 110 C344 190 432 190 492 110 C552 30 642 30 700 110" fill="none" stroke="#0f766e" stroke-width="6" opacity=".18"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2933">
    <g>
      <rect x="30" y="76" width="96" height="56" rx="8" fill="#ffffff" stroke="#d6dde3"/>
      <text x="78" y="110" text-anchor="middle">Reality</text>
    </g>
    <g>
      <rect x="138" y="76" width="86" height="56" rx="8" fill="#ffffff" stroke="#d6dde3"/>
      <text x="181" y="110" text-anchor="middle">Data</text>
    </g>
    <g>
      <rect x="236" y="76" width="112" height="56" rx="8" fill="#ffffff" stroke="#d6dde3"/>
      <text x="292" y="110" text-anchor="middle">Database</text>
    </g>
    <g>
      <rect x="360" y="76" width="76" height="56" rx="8" fill="#ffffff" stroke="#d6dde3"/>
      <text x="398" y="110" text-anchor="middle">SQL</text>
    </g>
    <g>
      <rect x="448" y="76" width="90" height="56" rx="8" fill="#ffffff" stroke="#d6dde3"/>
      <text x="493" y="110" text-anchor="middle">Insight</text>
    </g>
    <g>
      <rect x="550" y="76" width="100" height="56" rx="8" fill="#ffffff" stroke="#d6dde3"/>
      <text x="600" y="110" text-anchor="middle">Decision</text>
    </g>
    <g>
      <rect x="274" y="156" width="212" height="44" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="380" y="184" text-anchor="middle" fill="#9a3412">Business Impact</text>
    </g>
  </g>
  <g stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)" opacity=".8">
    <line x1="126" y1="104" x2="136" y2="104"/>
    <line x1="224" y1="104" x2="234" y2="104"/>
    <line x1="348" y1="104" x2="358" y2="104"/>
    <line x1="436" y1="104" x2="446" y2="104"/>
    <line x1="538" y1="104" x2="548" y2="104"/>
    <path d="M600 132 C590 158 520 178 488 178" fill="none"/>
  </g>
</svg>
